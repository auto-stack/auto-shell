[package]
name = "ash-tui"
version = "0.1.0"
edition = "2021"
description = "ASH terminal frontend (reedline REPL + ratatui rendering) — split from auto-shell (Plan 037 M2.2)"
authors = ["AutoLang Contributors"]
license = "MIT"

[dependencies]
# The pure Shell logic layer (Plan 037 M2.2): ash-tui builds ON TOP of auto-shell,
# pulling in Shell + commands + completions + ai. These path deps mirror
# auto-shell's, since both crates live in the same `ash/` workspace dir.
auto-shell = { path = "../auto-shell" }
auto-lang = { path = "../../../auto-lang/crates/auto-lang" }
auto-val = { path = "../../../auto-lang/crates/auto-val" }
auto-ai-client = { path = "../../../auto-ai/crates/auto-ai-client" }
auto-ai-agent = { path = "../../../auto-ai/crates/auto-ai-agent" }
ash-core = { path = "../../ash-core" }

# Terminal & REPL (Plan 037 M2.2: these move from auto-shell's optional deps to
# ash-tui's mandatory deps — the crate boundary now provides the isolation that
# the `frontend-tui` feature flag used to give).
reedline = "0.44.0"
# Plan 038 M0: unified to 0.29 (was 0.27). reedline 0.44.0 hard-requires
# crossterm 0.29.0 and re-exports its KeyCode/KeyModifiers (lib.rs:300); the old
# 0.27 pin produced a dual-version (0.27+0.29) lock with incompatible types.
crossterm = "0.29"
nu-ansi-term = "0.50"
# Plan 038 M0: enable scrolling-regions (flicker-free insert_before) + add the
# crossterm backend + the textarea widget for the block-TUI editor.
# scrolling-regions lives on ratatui-crossterm (it forwards to ratatui-core
# AND provides its own scroll_region_up/down Backend impls); enabling it only
# on ratatui-core makes the trait add required methods the backend doesn't impl.
ratatui-core = "0.1"
ratatui-widgets = "0.3"
ratatui-crossterm = { version = "0.1", features = ["scrolling-regions"] }
ratatui-textarea = "0.9"

# Prompt engine deps (module.rs/modules/ use rayon + nu-ansi-term; time.rs uses chrono)
rayon = "1.12"
chrono = "0.4"
# repl.rs builds a tokio Runtime for the AI chat session.
tokio = { version = "1", features = ["full"] }

# Shared with auto-shell — pinned to the same versions for type compatibility.
indexmap = "2.0"
dirs = "5.0"
miette = "7.0"
unicode-width = "0.2"
