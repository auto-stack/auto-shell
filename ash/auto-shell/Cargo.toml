[package]
name = "auto-shell"
version = "0.1.0"
edition = "2021"
description = "ASH - A modern shell environment using AutoLang as the scripting language"
authors = ["AutoLang Contributors"]
license = "MIT"

[[bin]]
name = "ash"
path = "src/main.rs"
# Plan 030 M0: the CLI binary needs the TUI frontend (REPL/reedline). Building
# without `frontend-tui` produces the library only (for ash-gui to consume).
required-features = ["frontend-tui"]

# Plan 030 M0: terminal/frontend deps are optional behind the `frontend-tui`
# feature. This lets a GUI frontend (ash-gui) depend on auto-shell's logic
# without pulling reedline/crossterm/ratatui/nu-ansi-term. `default` keeps the
# CLI build identical to before.
[features]
default = ["frontend-tui"]
frontend-tui = [
    "dep:reedline",
    "dep:crossterm",
    "dep:nu-ansi-term",
    "dep:ratatui-core",
    "dep:ratatui-widgets",
]

[dependencies]
# AutoLang integration (Plan 330: paths point back to the auto-lang repo)
auto-lang = { path = "../../../auto-lang/crates/auto-lang" }
auto-val = { path = "../../../auto-lang/crates/auto-val" }

# Plan 325: AI client for F3 AI mode (from auto-ai repo at ../../../auto-ai)
auto-ai-client = { path = "../../../auto-ai/crates/auto-ai-client" }
# Plan 029: agent harness (Role/Agent/Tool) — lets ash define domain Roles
# (e.g. SmartCommandRole) and use Agent::run for tool-calling, instead of
# hand-rolling LLM calls.
auto-ai-agent = { path = "../../../auto-ai/crates/auto-ai-agent" }
# Plan 029: async-trait macro for implementing the async Tool trait.
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
# Plan 027: explicit dep (previously transitive via auto-ai-client -> ai-config)
serde_json = "1.0"

# Ash Core (pure logic, zero terminal deps)
ash-core = { path = "../../ash-core" }

# Terminal and REPL (Plan 030 M0: optional, gated behind `frontend-tui`)
reedline = { version = "0.44.0", optional = true }
crossterm = { version = "0.27", optional = true }
nu-ansi-term = { version = "0.50", optional = true }

# Ratatui rendering (core + widgets without crossterm backend)
ratatui-core = { version = "0.1", optional = true }
ratatui-widgets = { version = "0.3", optional = true }

# Data structures
indexmap = "2.0"

# Platform support
dirs = "5.0"
# 系统信息（来自 nushell）
sysinfo = "0.33"
# 用系统默认程序打开文件（Plan 004: open 命令的 GUI 打开）
opener = "0.8"

# File system utilities
uucore = "0.0.27"
glob = "0.3"
# Individual uuutils commands (pick what we need)
# We'll implement simple versions ourselves for better integration

# Utilities
chrono = "0.4"
regex = "1.10"
unicode-segmentation = "1.10"
unicode-width = "0.2"
# Syntax highlighting for `show` command (bat-style code coloring)
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
# Note: Using regex crate instead of grep crate for simpler API
# ripgrep's grep crate has complex module structure that's not well documented

# Prompt engine
rayon = "1.12"
toml = "0.8"
toml_edit = "0.22"

# File watching (git info refresh on .git changes)
notify = "7.0"

# Error handling
miette = "7.0"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
