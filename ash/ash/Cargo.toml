[package]
name = "ash"
version = "0.1.0"
edition = "2021"
description = "ASH — AutoShell CLI: linear output + dynamic tail (frontend modules fused from ash-tui, Plan 071)"
authors = ["AutoLang Contributors"]
license = "MIT"

[lib]
name = "ash"
path = "src/lib.rs"

[[bin]]
name = "ash"
path = "src/main.rs"

[dependencies]
# The pure Shell logic layer — ash builds ON TOP of auto-shell, pulling in
# Shell + commands + completions + ai. auto-shell keeps ZERO terminal
# dependencies; the module boundary (frontend/) provides the isolation the
# old ash-tui crate used to give (Plan 071 Phase 2 fusion).
auto-shell = { path = "../auto-shell" }
auto-lang = { path = "../../../auto-lang/crates/auto-lang" }
auto-val = { path = "../../../auto-lang/crates/auto-val" }
auto-ai-client = { path = "../../../auto-ai/crates/auto-ai-client" }
auto-ai-agent = { path = "../../../auto-ai/crates/auto-ai-agent" }
ash-core = { path = "../../ash-core" }

# Terminal & REPL (Plan 037 M2.2 moved these out of auto-shell; Plan 071
# Phase 2 moved them from ash-tui into ash).
reedline = "0.44.0"
# reedline 0.44.0 hard-requires crossterm 0.29.0 and re-exports its
# KeyCode/KeyModifiers; a 0.27 pin produces a dual-version lock with
# incompatible types (Plan 038 M0).
crossterm = "0.29"
nu-ansi-term = "0.50"
# scrolling-regions (flicker-free insert_before) lives on ratatui-crossterm
# (it forwards to ratatui-core AND provides its own scroll_region_up/down
# Backend impls; enabling it only on ratatui-core makes the trait add
# required methods the backend doesn't impl). ratatui-textarea powers the
# 070 editor overlay.
ratatui-core = "0.1"
ratatui-widgets = "0.3"
ratatui-crossterm = { version = "0.1", features = ["scrolling-regions"] }
ratatui-textarea = "0.9"

# Prompt engine deps (module.rs/modules/ use rayon + nu-ansi-term; time.rs uses chrono)
rayon = "1.12"
chrono = "0.4"
# repl.rs builds a tokio Runtime for the AI chat session.
tokio = { version = "1", features = ["full"] }

# Shared with auto-shell — pinned to the same versions for type compatibility.
indexmap = "2.0"
dirs = "5.0"
miette = "7.0"
unicode-width = "0.2"
