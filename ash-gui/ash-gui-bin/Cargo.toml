[package]
name = "ash-gui-bin"
version = "0.1.0"
edition = "2021"
description = "ASH GUI — AutoUI (iced) version of ash. Minimal GUI (Plan 030 M2)."

[[bin]]
name = "ash-gui"
path = "src/main.rs"

[dependencies]
# Shared shell logic, WITHOUT the TUI frontend (Plan 030 M0/M1: we consume
# ash-core's RenderedOutput, not the ratatui TUI).
ash-core = { path = "../../ash-core" }
auto-shell = { path = "../../ash/auto-shell", default-features = false }
# auto-lang WITH the ui-iced backend (the whole point of this workspace).
auto-lang = { path = "../../../auto-lang/crates/auto-lang", features = ["ui-iced"] }
# iced 0.14 (same version auto-lang's ui-iced uses) for the GUI widgets.
iced = { version = "0.14", features = ["tokio", "advanced"] }
# Shell commands produce auto_val values; the GUI reads them for rendering.
auto-val = { path = "../../../auto-lang/crates/auto-val" }

