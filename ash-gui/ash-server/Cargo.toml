[package]
name = "ash-server"
version = "0.1.0"
description = "Unified Shell backend for ash-gui — serves both HTTP (browser) and Tauri IPC (desktop)"
authors = ["AutoLang Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ash_server"
crate-type = ["rlib"]

[[bin]]
name = "ash-server"
path = "src/bin/ash-server.rs"

[dependencies]
# Shell engine (same as ash-gui-vue)
ash-core = { path = "../../ash-core" }
auto-shell = { path = "../../ash/auto-shell", default-features = false }

# Async runtime + channels
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP server (M2 — axum + tower for CORS)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# This crate is its OWN workspace (like ash-gui-vue/ash-gui-bin) so its
# dependency graph does not unify into the shell's workspace.
[workspace]
