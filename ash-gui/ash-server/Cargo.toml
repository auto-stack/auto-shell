[package]
name = "ash-server"
version = "0.1.0"
description = "Unified Shell backend for ash-gui — serves both HTTP (browser) and Tauri IPC (desktop)"
authors = ["AutoLang Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ash_server"
# Plan 061:cdylib 供 `auto run` merged 模式装载(backend_abi 插件 ABI);
# rlib 供 ash-server bin(HTTP)直链。
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ash-server"
path = "src/bin/ash-server.rs"

[dependencies]
# Shell engine
ash-core = { path = "../../ash-core" }
auto-shell = { path = "../../ash/auto-shell", default-features = false }
# Plan 062 T11: NL→命令翻译复用 CLI F3 同款 aaid 客户端(auto-ai 兄弟仓,
# 锚定同 ash-tui / auto-shell 的 path 布局)。
auto-ai-client = { path = "../../../auto-ai/crates/auto-ai-client" }
# Plan 062 T12:块内 AI chat 复用 ChatSession(Agent/ReAct/工具调用)。
auto-ai-agent = { path = "../../../auto-ai/crates/auto-ai-agent" }
async-trait = "0.1"

# 宿主桥协议:auto_lang::vm::backend_abi(cdylib 装载/事件注入 ABI)。
# 跨仓 path 依赖锚定 D:\autostack 兄弟布局:主检出直接成立。
auto-lang = { path = "../../../auto-lang/crates/auto-lang", default-features = false, features = ["with-file-history", "ui-iced"] }

# ui-iced 会启用 wgpu-hal 的 DX12 后端。让 GUI host 与 wgpu-hal 使用相同
# 的 Windows bindings；ash-server/Cargo.lock 同时将 gpu-allocator 对齐到 0.58，
# 否则 DX12 类型来自不同版本的 windows/windows-core，无法互相传递。
[target.'cfg(windows)'.dependencies]
windows = "0.58"

# Async runtime + channels
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP server (M2 — axum;Plan 072 M1 删除了从未用到的 tower-http:
# 原 http.rs 注释自称 "+ CORS" 但没有实现,防护由 guard.rs 中间件承担)
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# Plan 072 M1: guard 路由级测试(oneshot 直接打 Router)。
tower = { version = "0.4", features = ["util"] }

# This crate is its OWN workspace so its dependency graph does not
# unify into the shell's workspace.
[workspace]
