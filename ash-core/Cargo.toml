[package]
name = "ash-core"
version = "0.1.0"
edition = "2021"
description = "AutoShell core engine — pure logic, zero terminal dependencies"
authors = ["AutoLang Contributors"]
license = "MIT"

[dependencies]
# AutoLang value system
auto-val = { path = "../../auto-lang/crates/auto-val" }

# Data structures
indexmap = "2.0"

# Platform support
dirs = "5.0"
sysinfo = "0.33"

# Utilities
chrono = "0.4"
regex = "1.10"

# Error handling
miette = "7.0"
thiserror = "1.0"

# Plan 028: Tool Registry 需要 JSON Schema 序列化。
# 只用于 tool/ 模块;现有 Atom/AtomPipeline/SecurityPolicy 不加 derive。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "batom_bench"
harness = false
