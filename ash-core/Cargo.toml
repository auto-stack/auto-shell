[package]
name = "ash-core"
version = "0.1.0"
edition = "2021"
description = "AutoShell core engine — pure logic, zero terminal dependencies"
authors = ["AutoLang Contributors"]
license = "MIT"

[dependencies]
# AutoLang value system
auto-val = { path = "../../auto-lang/crates/auto-val" }

# Data structures
indexmap = "2.0"

# Platform support
dirs = "5.0"
sysinfo = "0.35"

# Utilities
chrono = "0.4"
regex = "1.10"

# Error handling
miette = "7.0"
thiserror = "1.0"

# Serialization (SecurityPolicy::PolicySummary derive + tests)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "batom_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

# Plan 080 T7: quote 热路径基准(Auto 单源化试点性能基线,对照
# tests/auto-parity/cases/quote/_bench-*.at 的 VM 差分计时)。
[[bench]]
name = "quote_bench"
harness = false
